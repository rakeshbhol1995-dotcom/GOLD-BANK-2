<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7D6" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <linearGradient id="goldInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE87C" />
      <stop offset="50%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#5C3E00" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <circle cx="50" cy="50" r="46" fill="url(#goldOuter)" filter="url(#goldGlow)" />
  <circle cx="50" cy="50" r="41" fill="#080B11" />
  <circle cx="50" cy="50" r="37" fill="url(#goldInner)" />
  
  <!-- Sovereign Shield Crest -->
  <path d="M50 25 L65 33 V50 C65 62 50 72 50 72 C50 72 35 62 35 50 V33 Z" 
        fill="#080B11" stroke="#FFD700" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Checkmark -->
  <path d="M43 49 L48 54 L58 43" 
        fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
